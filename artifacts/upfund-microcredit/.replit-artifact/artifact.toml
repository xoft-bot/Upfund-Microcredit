kind = "web"
previewPath = "/"
title = "Upfund Microcredit"
description = "A branch-aware microcredit operations app adapted from the Upfund-Microcredit repository, with role-based portfolio management, loan workflows, field collections, reconciliation, and reporting."
version = "1.0.0"
id = "artifacts/upfund-microcredit"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20987

[services.development]
run = "pnpm --filter @workspace/upfund-microcredit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/upfund-microcredit", "run", "build" ]
serve = "static"
publicDir = "artifacts/upfund-microcredit/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20987"
BASE_PATH = "/"
