name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Integration tests skip themselves when DATABASE_URL is unset, and two auth tests need a real
    # database regardless. Without this service CI was red on every run and ~58 tests never ran.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: upfund
          POSTGRES_PASSWORD: upfund
          POSTGRES_DB: upfund_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upfund -d upfund_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://upfund:upfund@127.0.0.1:5432/upfund_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Apply database migrations
        run: pnpm run db:migrate

      - name: Test
        run: pnpm test -- --run

      - name: Build
        run: pnpm run build

      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_UPFUND_MICROCREDIT }}'
          projectId: upfund-microcredit
          channelId: live
